# Controlli automatici a ogni push e a ogni pull request: segreti nella cronologia e analisi statica del codice.
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analisi statica del codice (Semgrep)
        run: >-
          pipx run semgrep==1.177.0 scan --metrics=off --error
          --config p/default --config p/owasp-top-ten --config p/secrets
          tools docs/assets

      - name: Ricerca di segreti (gitleaks)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
